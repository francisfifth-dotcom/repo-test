name: Coffee shop pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coffee-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  documentation:
    name: Documentation gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a feature report with feature changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-docs.mjs "$BASE_SHA"

  deploy:
    name: Deploy to Vercel
    needs: quality
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check deployment credentials
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
      - name: Deploy preview
        if: github.ref == 'refs/heads/develop'
        run: |
          npx --no-install vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --no-install vercel build --token="$VERCEL_TOKEN"
          npx --no-install vercel deploy --prebuilt --token="$VERCEL_TOKEN" > deployment-url.txt
      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        run: |
          npx --no-install vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --no-install vercel build --prod --token="$VERCEL_TOKEN"
          npx --no-install vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" > deployment-url.txt
      - name: Record deployment URL
        run: cat deployment-url.txt >> "$GITHUB_STEP_SUMMARY"
